services:
  postgres:
    image: postgres:17-alpine
    container_name: nextface-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-nextface}
      POSTGRES_USER: ${DB_USERNAME:-nextface}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nextface}
    ports:
      - "5432:5432"
    volumes:
      - nextface-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-nextface} -d ${DB_NAME:-nextface}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nextface-postgres-data:
