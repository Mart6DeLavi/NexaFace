spring:
  application:
    name: nextface-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nextface}
    username: ${DB_USERNAME:nextface}
    password: ${DB_PASSWORD:nextface}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      # Face enrollment images are uploaded through the backend.
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8080}

nextface:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    # Development default only; override JWT_SECRET outside local development.
    secret: ${JWT_SECRET:nextface-development-only-secret-key-change-me}
    expiration: ${JWT_EXPIRATION:PT1H}
  face-service:
    base-url: ${FACE_SERVICE_URL:http://localhost:8000}
    connect-timeout: ${FACE_SERVICE_CONNECT_TIMEOUT:PT3S}
    read-timeout: ${FACE_SERVICE_READ_TIMEOUT:PT10S}

logging:
  level:
    com.nextface: INFO
